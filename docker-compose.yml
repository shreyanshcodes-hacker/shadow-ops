version: '3.8'

services:
  # PostgreSQL database (using Supabase locally or standalone Postgres)
  postgres:
    image: postgres:16-alpine
    container_name: shadowops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shadowops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery broker and result backend
  redis:
    image: redis:7-alpine
    container_name: shadowops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: shadowops-api
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/shadowops
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SCAN_WORKSPACE_ROOT=/scan-workspace
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - scan_workspace:/scan-workspace
      - ./backend/app:/app/app:ro  # Read-only for hot reload in dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scanner Worker - Isolated with Security Constraints
  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    container_name: shadowops-scanner
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/shadowops
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SCAN_WORKSPACE_ROOT=/scan-workspace
      - WORKER_SCAN_TIMEOUT=1800
      - WORKER_MAX_TARGET_SIZE_MB=1000
      - WORKER_MAX_FILE_SIZE_MB=10
      - WORKER_SEMGREP_TIMEOUT=1800
    volumes:
      - scan_workspace:/scan-workspace:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security hardening for scanner container
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /tmp/semgrep-cache
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    # Network isolation - only internal network
    networks:
      - shadowops-internal
    # No port exposure for scanner

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadowops-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  scan_workspace:

networks:
  shadowops-internal:
    driver: bridge
    internal: true  # No external internet access
  default:
    driver: bridge